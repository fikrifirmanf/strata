# Strata release pipeline (primary). Runs for v* tags: builds macOS (universal .dmg), Linux (.tar.gz)
# and Windows (setup .exe + portable .zip), then publishes a GitHub release with a SHA256SUMS.txt.
#
# If any job fails, the `circleci-fallback` job triggers the same release on CircleCI
# (.circleci/config.yml, which only runs when started this way).
#
# Required repository secret: CIRCLECI_TOKEN  a CircleCI personal API token.
# Releasing: bump `version` in Cargo.toml, commit, then `git tag v<version> && git push --tags`.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: version
        run: ./.github/scripts/resolve-version.sh
      - run: ./scripts/package-linux.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux, path: dist/* }

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - id: version
        run: ./.github/scripts/resolve-version.sh
      - run: cargo test --locked --release
      - run: ./scripts/package-macos.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/* }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NASM: aws-lc-sys (crypto for the russh SSH client) assembles its Windows sources with it.
      - name: Install Inno Setup and NASM
        run: choco install innosetup nasm -y --no-progress
      - id: version
        shell: bash
        run: ./.github/scripts/resolve-version.sh
      - name: Test, build and package
        shell: pwsh
        run: |
          $env:Path = "$env:ProgramFiles\NASM;$env:Path"
          cargo test --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows, path: dist/* }

  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Strata ${tag#v}" --generate-notes --verify-tag $prerelease
          fi

  circleci-fallback:
    needs: [build-linux, build-macos, build-windows, publish-release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the release on CircleCI
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          if [ -z "${CIRCLECI_TOKEN:-}" ]; then
            echo "CIRCLECI_TOKEN secret is not set" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            "https://circleci.com/api/v2/project/gh/${GITHUB_REPOSITORY}/pipeline" \
            -H "Circle-Token: ${CIRCLECI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${GITHUB_REF_NAME}\", \"parameters\": {\"run-fallback\": true}}"
