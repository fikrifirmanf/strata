[package]
name = "strata"
version = "0.2.0"
edition = "2021"
description = "Strata — a fast, native, cross-platform database workbench"
license = "MIT"

build = "build.rs"
repository = "https://github.com/fikrifirmanf/strata"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
# UI
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "clipboard", "links"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
egui_plot = "0.38"
rfd = "0.17"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
futures = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
percent-encoding = "2"
csv = "1"
rust_xlsxwriter = "0.101"
sqlformat = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
regex = "1"
async-trait = "0.1"
json5 = "0.4"
sha2 = "0.10"
hex = "0.4"
plist = "1"

# drivers
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
redis = { version = "0.32", features = ["tokio-comp", "tokio-native-tls-comp"] }
mongodb = "3"
bson = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.65"
base64 = "0.22"

raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSVisualEffectView", "NSResponder", "NSGraphics", "objc2-core-foundation"] }
muda = { version = "0.20", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(not(target_os = "windows"))'.dependencies]
odbc-api = { version = "29.2", default-features = false, features = ["odbc_version_3_80", "vendored-unix-odbc"] }

[target.'cfg(target_os = "windows")'.dependencies.odbc-api]
version = "29.2"
default-features = false
features = ["odbc_version_3_80"]
