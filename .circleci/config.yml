# Strata CI/CD, fallback pipeline.
#
# The primary release pipeline is GitHub Actions (.github/workflows/release.yml). This workflow does
# not run on tag pushes; GitHub Actions starts it through the CircleCI API (with the
# `run-fallback` parameter) only when one of its jobs fails.
#
# Same job as the primary, for v* release tags: builds macOS (universal .dmg), Linux (.tar.gz) and Windows
# (setup .exe installer plus a portable .zip), then publishes a GitHub release with those files
# and a SHA256SUMS.txt attached. The macOS and Windows jobs run the test suite before packaging.
#
# Required project environment variable (Project Settings → Environment Variables):
#   GH_TOKEN  a GitHub token that can create releases on this repository
#             (fine-grained: Contents read & write; classic: repo / public_repo).
#
# Releasing: bump `version` in Cargo.toml, commit, then `git tag v<version> && git push --tags`.
# The tag must match Cargo.toml, because the in-app update check compares against that version.

version: 2.1

orbs:
  win: circleci/windows@5.1

parameters:
  run-fallback:
    type: boolean
    default: false
  rust-version:
    type: string
    default: stable

commands:
  install-rust-unix:
    parameters:
      targets:
        type: string
        default: ""
    steps:
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            for t in << parameters.targets >>; do rustup target add "$t"; done
            rustc --version

  linux-deps:
    steps:
      - run:
          name: Install system libraries
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev

  release-version:
    description: Exports VERSION from Cargo.toml and checks it against the tag on tag builds.
    steps:
      - run:
          name: Resolve version
          command: |
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            if [ -n "${CIRCLE_TAG:-}" ] && [ "${CIRCLE_TAG#v}" != "$version" ]; then
              echo "Tag $CIRCLE_TAG does not match Cargo.toml version $version" >&2
              exit 1
            fi
            echo "export VERSION=$version" >> "$BASH_ENV"

  cargo-cache-restore:
    parameters:
      key:
        type: string
    steps:
      - restore_cache:
          keys:
            - cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
            - cargo-v1-<< parameters.key >>-

  cargo-cache-save:
    parameters:
      key:
        type: string
    steps:
      - save_cache:
          key: cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

jobs:
  build-linux:
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - linux-deps
      - install-rust-unix
      - release-version
      - cargo-cache-restore:
          key: linux-release
      - run:
          name: Build and package
          command: ./scripts/package-linux.sh "$VERSION"
      - cargo-cache-save:
          key: linux-release
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  build-macos:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - install-rust-unix:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - release-version
      - cargo-cache-restore:
          key: macos-release
      - run:
          name: Test
          command: cargo test --locked --release
      - run:
          name: Build and package universal app
          command: ./scripts/package-macos.sh "$VERSION"
      - cargo-cache-save:
          key: macos-release
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  build-windows:
    executor:
      name: win/default
      size: large
    steps:
      - checkout
      - run:
          name: Install Rust
          command: |
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            Remove-Item rustup-init.exe
      - run:
          # NASM: aws-lc-sys (crypto for the russh SSH client) assembles its Windows sources with it.
          name: Install Inno Setup and NASM
          command: choco install innosetup nasm -y --no-progress
      - restore_cache:
          keys:
            - cargo-v1-windows-release-{{ checksum "Cargo.lock" }}
            - cargo-v1-windows-release-
      - run:
          name: Test, build and package
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:ProgramFiles\NASM;$env:Path"
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
            if ($env:CIRCLE_TAG -and $env:CIRCLE_TAG.TrimStart('v') -ne $version) { throw "Tag $env:CIRCLE_TAG does not match Cargo.toml version $version" }
            cargo test --locked --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\scripts\package-windows.ps1 -Version $version
      - save_cache:
          key: cargo-v1-windows-release-{{ checksum "Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.cargo\git
            - target
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish-release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install GitHub CLI
          command: |
            curl -sSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar -xz
            sudo mv gh_2.62.0_linux_amd64/bin/gh /usr/local/bin/gh
            gh --version
      - run:
          name: Create GitHub release
          command: |
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "GH_TOKEN is not set in the CircleCI project settings" >&2
              exit 1
            fi
            repo="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
            (cd dist && shasum -a 256 * > SHA256SUMS.txt)
            prerelease=""
            case "$CIRCLE_TAG" in *-*) prerelease="--prerelease" ;; esac
            if gh release view "$CIRCLE_TAG" --repo "$repo" >/dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" dist/* --repo "$repo" --clobber
            else
              gh release create "$CIRCLE_TAG" dist/* --repo "$repo" --title "Strata ${CIRCLE_TAG#v}" --generate-notes --verify-tag $prerelease
            fi

workflows:
  ci:
    when: << pipeline.parameters.run-fallback >>
    jobs:
      - build-linux:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+.*/
      - build-macos:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+.*/
      - build-windows:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+.*/
      - publish-release:
          requires: [build-linux, build-macos, build-windows]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+.*/
